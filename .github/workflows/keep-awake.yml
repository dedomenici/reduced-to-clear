# Keep the Render free instance warm (it sleeps after ~15 min without traffic) by pinging /healthz every 10 minutes.
#
# Runs 24/7. The repo is public, so GitHub-hosted standard runners cost no Actions minutes (144 short runs/day,
# ~4,320-4,464 runs/month). If the repo is ever made private again, each run is billed as a full minute, which
# would exceed the 2,000 free minutes: switch back to e.g. '*/10 12-21 * * *' (~1,800-1,860 min/month).
#
# Note: GitHub's scheduler is best-effort; scheduled runs are often delayed by several minutes (sometimes
# more under load) and may be skipped, so the site can still occasionally cold-start.
name: keep-awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /healthz
        run: curl -fsS --max-time 60 --retry 2 --retry-delay 5 --retry-all-errors https://reduced-to-clear.onrender.com/healthz
