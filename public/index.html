<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1d1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reduced">
<title>Reduced to Clear</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="/gate.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand"><span class="sticker">REDUCED TO CLEAR</span></div>
  <div class="loc">
    <button id="btn-locate" data-i18n-title="useMyLocation" data-i18n-aria-label="useMyLocation" title="Use my location" aria-label="Use my location">📍<span class="lbl"> <span data-i18n="nearMe">Near me</span></span></button>
    <form id="place-form" role="search"><input id="place" type="search" enterkeyhint="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria-label="searchLabel" placeholder="Postcode, town or place…" aria-label="Search for a place"><button data-i18n="go" aria-label="Search">Go</button></form>
    <select id="radius" data-i18n-aria-label="radius" aria-label="Radius"><option value="1">1 km</option><option value="3" selected>3 km</option><option value="10">10 km</option><option value="25">25 km</option></select>
  </div>
  <div class="acct">
    <button id="btn-sound" data-i18n-title="pingTitle" data-i18n-aria-label="toggleSound" title="Ping on new posts" aria-label="Toggle ping sound">🔇<span class="lbl"> Sound off</span></button>
    <span id="who"></span>
    <button id="btn-login"><span data-i18n="login">Log in</span><span class="lbl" data-i18n="loginOrRegister"> / Register</span></button>
    <button id="btn-logout" data-i18n="logout" hidden>Log out</button>
  </div>
</header>
<main>
  <div id="map" data-i18n-aria-label="mapLabel" aria-label="Map"></div>
  <div id="map-hint" class="map-hint" hidden></div>
  <div id="alert-toast" class="alert-toast" role="status" aria-live="polite" hidden></div>
  <button id="fab-post" class="fab" data-i18n-aria-label="postFab" aria-label="Post reductions">＋</button>
  <aside id="sheet" class="sheet" data-i18n-aria-label="feedLabel" aria-label="Reductions feed">
    <button id="sheet-handle" class="sheet-handle" aria-expanded="false" aria-controls="sheet-body">
      <span class="grip"></span><span id="sheet-summary">…</span><span class="chev">▲</span>
    </button>
    <div id="sheet-body" class="sheet-body">
      <div class="aside-head">
        <button id="btn-new" class="primary" data-i18n="postReductionsBtn">+ Post reductions</button>
        <label class="chk"><input type="checkbox" id="show-gone"> <span data-i18n="showGone">show "all gone"</span></label>
        <label class="chk"><input type="checkbox" id="show-pred" checked> <span data-i18n="showPredictions">show predictions</span></label>
      </div>
      <div id="live-status" class="muted small"></div>
      <div id="area-status" class="muted small" hidden></div>
      <ol id="feed"></ol>
      <p class="muted small" id="footer-note"></p>
      <p class="muted small" id="attribution"></p>
    </div>
  </aside>
</main>

<dialog id="dlg-auth">
  <form id="auth-form" method="dialog">
    <h2 id="auth-title">Log in</h2>
    <p class="muted small" data-i18n="authNeeded"></p>
    <label class="reg-only"><span data-i18n="displayName">Display name</span> <input name="displayName" maxlength="40" autocomplete="nickname"></label>
    <label><span data-i18n="email">Email</span> <input name="email" type="email" required autocomplete="email" inputmode="email" autocapitalize="off"></label>
    <label><span data-i18n="password">Password</span> <input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
    <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="err" id="auth-err"></p>
    <div class="row"><button type="submit" class="primary" id="auth-submit">Log in</button><button type="button" id="auth-cancel" data-i18n="cancel">Cancel</button></div>
    <p class="small"><a href="#" id="auth-toggle">No account? Register</a></p>
  </form>
</dialog>

<dialog id="dlg-post">
  <form id="post-form">
    <div class="dlg-top"><h2 data-i18n="postReductions">Post reductions</h2><button type="button" class="x" id="post-x" data-i18n-aria-label="close" aria-label="Close">✕</button></div>
    <label><span data-i18n="nearbyStore">Nearby store (optional)</span> <select name="store_id" id="store-select"><option value="" data-i18n="newStore">— new / not listed —</option></select></label>
    <div id="new-store-fields">
      <label><span data-i18n="supermarket">Supermarket</span> <select name="chain" id="chain-select"></select></label>
      <label id="chain-other-wrap" hidden><span data-i18n="supermarketName">Supermarket name</span> <input name="chain_other" maxlength="60" autocapitalize="words"></label>
      <label><span data-i18n="branchName">Branch name</span> <input name="store_name" data-i18n-placeholder="branchPlaceholder" maxlength="80" autocapitalize="words"></label>
      <label><span data-i18n="address">Address (optional)</span> <input name="address" maxlength="160" autocomplete="street-address"></label>
      <label><span data-i18n="city">Town / city (optional)</span> <input name="city" maxlength="60" autocomplete="address-level2" autocapitalize="words"></label>
    </div>
    <label><span data-i18n="whatsReduced">What's reduced?</span> <textarea name="items" required maxlength="1000" rows="3" enterkeyhint="next" data-i18n-placeholder="itemsPlaceholder"></textarea></label>
    <label><span data-i18n="priceNotes">Prices / notes (optional)</span> <input name="price_note" id="price-note" maxlength="200"></label>
    <label><span data-i18n="timeSeen">Time seen</span> <input type="datetime-local" name="seen_local" required></label>
    <fieldset><legend data-i18n="location">Location</legend>
      <div class="row"><button type="button" id="loc-here" data-i18n="useMyLocationBtn">📍 Use my location</button><button type="button" id="loc-pick" data-i18n="pickOnMap">🗺 Pick on map</button></div>
      <p class="small" id="loc-text" data-i18n="notSet">Not set</p>
      <p class="small" id="loc-detected"></p>
      <p class="small muted" data-i18n="detectedNote"></p>
      <input type="hidden" name="lat"><input type="hidden" name="lng">
    </fieldset>
    <fieldset id="photo-fieldset" hidden><legend data-i18n="photoOptional">Photo (optional)</legend>
      <div class="row">
        <label class="filebtn"><span data-i18n="takePhoto">📷 Take photo</span><input type="file" id="photo-camera" accept="image/*" capture="environment"></label>
        <label class="filebtn"><span data-i18n="choosePhoto">🖼 Choose photo</span><input type="file" id="photo-gallery" accept="image/*"></label>
      </div>
      <div id="photo-preview" class="small muted" data-i18n="noPhoto">No photo</div>
    </fieldset>
    <p class="err" id="post-err"></p>
    <div class="row sticky-actions"><button type="submit" class="primary" data-i18n="post">Post</button><button type="button" id="post-cancel" data-i18n="cancel">Cancel</button></div>
  </form>
</dialog>

<dialog id="dlg-pred"><div id="pred-body"></div><button id="pred-close" data-i18n="close">Close</button></dialog>
<div id="pick-banner" class="pick-banner" hidden><span data-i18n="pickBanner">Tap the map to set the store location</span> <button id="pick-cancel" data-i18n="cancel">Cancel</button></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="/i18n.js"></script>
<script src="/alerts.js"></script>
<script src="/app.js"></script>
</body>
</html>
