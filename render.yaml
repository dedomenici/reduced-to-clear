# Render Blueprint for Reduced to Clear — FREE deployment (no subscriptions).
# Spec: https://render.com/docs/blueprint-spec
#
# Data lives in Turso (free libSQL/SQLite cloud DB) so nothing is lost when the free Render
# instance restarts, redeploys or spins down. There is no persistent disk on Render's free plan,
# so photo uploads are disabled (PHOTOS_ENABLED unset); posts work without photos.
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo. You'll be prompted for the
# three sync:false values below. SITE_SECRET is generated by Render.
services:
  - type: web
    name: reduced-to-clear
    runtime: node
    region: frankfurt          # closest Render region to London
    plan: free                 # spins down after 15 min idle (~1 min cold start); 750 free hours/month
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SITE_PASSWORD        # site-wide access password (gate page)
        sync: false
      - key: TURSO_DATABASE_URL   # e.g. libsql://reduced-to-clear-<you>.turso.io
        sync: false
      - key: TURSO_AUTH_TOKEN     # from `turso db tokens create reduced-to-clear`
        sync: false
      - key: SITE_SECRET          # signs the gate cookie; env-only in hosted mode (never written to disk)
        generateValue: true
      # Photo uploads need persistent storage, which the free plan lacks. Leave unset (= disabled).
      # - key: PHOTOS_ENABLED
      #   value: "true"
